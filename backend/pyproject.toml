[project]
name = "devloop"
version = "0.1.0"
description = "DevLoop — 動工前的規格閘門與決策沉澱（Jira 卡 → 規格 → 凍結 → 決策圖譜）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "neo4j>=5.24",
    "uuid-utils>=0.9",
    "cryptography>=50.0.0",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "import-linter>=2.1",
]

[project.scripts]
devloop = "devloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devloop"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003 是防同形字攻擊的，會把中文全形標點全部標成可疑 —— 這個專案的註解是中文
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["devloop"]

[[tool.mypy.overrides]]
module = ["uuid_utils.*", "neo4j.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# 模組邊界 —— 抄 JobRadar 的紀律：邊界靠 import-linter，不靠微服務
[tool.importlinter]
root_package = "devloop"

[[tool.importlinter.contracts]]
name = "外部接點彼此獨立（jira / runner / graph）"
type = "independence"
modules = ["devloop.jira", "devloop.runner", "devloop.graph"]

[[tool.importlinter.contracts]]
name = "core 是葉子 —— 不 import 任何其他模組"
type = "forbidden"
source_modules = ["devloop.core"]
forbidden_modules = [
    "devloop.db",
    "devloop.jira",
    "devloop.runner",
    "devloop.graph",
    "devloop.spec",
    "devloop.api",
]

[[tool.importlinter.contracts]]
name = "spec 不直接碰外部世界（只透過 Protocol）"
type = "forbidden"
source_modules = ["devloop.spec.schema"]
forbidden_modules = ["devloop.jira", "devloop.runner", "devloop.graph", "devloop.api"]
